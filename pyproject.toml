[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lanrouge-nails-bot"
version = "0.1.0"
description = "Telegram CRM and appointment booking bot for lanrouge nails"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "maggogerka" }]
dependencies = [
  "aiogram==3.30.0",
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "pydantic-settings==2.14.2",
  "redis==8.0.1",
  "SQLAlchemy[asyncio]==2.0.51",
  "tzdata>=2026.1,<2027.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.15.22",
]

[project.scripts]
lanrouge-bot = "app.bot:run"
lanrouge-healthcheck = "app.healthcheck:run"
lanrouge-reminders = "app.workers.reminders:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
