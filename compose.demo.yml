name: crm-public-demo

x-logging: &demo-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:8.2.7-alpine
    user: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/demo_redis_password
    secrets:
      - demo_redis_password
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/secrets/demo_redis_password)"
        exec redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$$password"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/demo_redis_password) redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - demo-backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.25
    logging: *demo-logging

  bot:
    build:
      context: .
      target: runtime
    env_file: ${DEMO_ENV_FILE:-.env.demo}
    environment:
      APP_MODE: demo
      BOT_TOKEN_FILE: /run/secrets/demo_bot_token
      REDIS_PASSWORD_FILE: /run/secrets/demo_redis_password
      HEALTHCHECK_COMPONENT: bot
    secrets:
      - demo_bot_token
      - demo_redis_password
    command: ["python", "-m", "app.bot"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - demo-backend
      - demo-egress
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.demo.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging: *demo-logging

networks:
  demo-backend:
    internal: true
  demo-egress:

secrets:
  demo_bot_token:
    file: ${DEMO_BOT_TOKEN_SECRET_FILE:-./.secrets/demo_bot_token}
  demo_redis_password:
    file: ${DEMO_REDIS_PASSWORD_SECRET_FILE:-./.secrets/demo_redis_password}
