# CI-only runtime overrides. Never use this file for production deployment.
services:
  api:
    environment:
      BOT_TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
      API_ALLOWED_HOSTS: api.test
      MINI_APP_ALLOWED_ORIGINS: https://api.test
      API_RATE_LIMIT_SUBJECT_KEY: ci-rate-limit-subject-key-0123456789abcdef
      API_SESSION_SIGNING_KEY: ci-session-signing-key-0123456789abcdef

  backup:
    environment:
      APP_ENV: test
      BACKUP_ENABLED: "true"
      BACKUP_ALLOW_LOCAL_REPOSITORY_FOR_TESTS: "true"
      RESTIC_REPOSITORY: /repository
      RESTIC_CACHE_DIR: /tmp/restic-cache
      RESTORE_DATABASE_URL: postgresql+asyncpg://app_user:placeholder@postgres:5432/app_restore_test
      RESTORE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      RESTORE_ACKNOWLEDGE: RESTORE_TO_SEPARATE_TEST_DATABASE
    volumes:
      - ./.ci-backup-repository:/repository
