name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lanrouge
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lanrouge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanrouge -d lanrouge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://lanrouge:password@localhost:5432/lanrouge_test
      TEST_DATABASE_URL: postgresql+asyncpg://lanrouge:password@localhost:5432/lanrouge_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Guard local secrets
        run: test -z "$(git ls-files .env)"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Migrate v0.1 schema to v0.3 head
        run: |
          alembic upgrade 20260722_0001
          alembic upgrade head
          alembic check
      - name: Dependency healthcheck
        run: python -m app.healthcheck
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime and test images
        run: |
          docker build --target runtime --tag lanrouge-nails-bot:ci .
          docker build --target test --tag lanrouge-nails-bot-test:ci .
      - name: Validate Compose interpolation
        env:
          POSTGRES_PASSWORD: ci-only-password
          ENV_FILE: .env.example
        run: docker compose config --quiet
