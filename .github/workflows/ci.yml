name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lanrouge
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lanrouge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanrouge -d lanrouge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://lanrouge:password@localhost:5432/lanrouge_test
      TEST_DATABASE_URL: postgresql+asyncpg://lanrouge:password@localhost:5432/lanrouge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Apply migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest
